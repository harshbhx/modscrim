<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModScrim intro</title>
<link rel="stylesheet" href="cards.css"></head>
<body>
<div class="pitch" aria-hidden="true"><div class="circle"></div><div class="half"></div></div>
<main class="intro">
  <img class="mark" src="../../../../brand/logo/svg/modscrim-mark-reverse.svg" alt="">
  <img class="wordmark" src="../../../../brand/logo/svg/modscrim-wordmark-reverse.svg" alt="ModScrim">
  <p class="tagline">Raid drills for your mod team.</p>
</main>
<script>
  Promise.all([document.fonts.ready, ...Array.from(document.images).map((i) => i.decode().catch(() => {}))])
    .then(() => { window.__ready = true; });
  window.__go = () => document.body.classList.add('go');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.body.classList.add('go');
</script>
</body></html>
