name: End-to-end

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read Playwright version
        id: playwright-version
        run: node -e "console.log('version=' + require('playwright/package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium (download on cache miss, system deps always)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi
      # Surface specs assert this branch's markup, which the deployed Worker is
      # not serving yet, so they run against a build of the branch instead.
      - name: Build the SPA for the surface specs
        run: npm run build -w app

      - name: Run surface projects against this branch's build
        env:
          # Both are set so the config's isLocal check is false and it does not
          # also try to boot `npm run dev`, which needs secrets CI does not have.
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SURFACE_BASE_URL: http://127.0.0.1:4173
          A11Y_ENFORCE: '1'
        run: |
          node scripts/serve-static.mjs app/dist/client 4173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ >/dev/null || { echo 'static server never came up'; exit 1; }
          npx playwright test --project=landing --project=shell-surface --project=console-surface --project=report-surface --project=mod-surface --project=overlay-surface --project=shared-states --project=a11y --reporter=list

      - name: Run Playwright projects
        env:
          PLAYWRIGHT_BASE_URL: https://app.modscrim.dualmindlab.tech
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-results.json
        run: |
          mkdir -p test-results
          npx playwright test --project=setup --project=smoke --project=safety --project=console --project=mod --pass-with-no-tests --reporter=list,html,json
      - name: Add per-project results to the job summary
        if: always()
        run: node scripts/e2e-summary.mjs

      # Uploaded even when green: these are how a surface's light and dark
      # rendering gets reviewed at each width without running the app locally.
      - name: Upload surface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: app/e2e/screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            app/e2e/report
            test-results
          if-no-files-found: warn
          retention-days: 14