name: Deploy app

# Every push to main that touches the app runs the checks, applies D1 migrations
# and deploys the Worker to https://app.modscrim.dualmindlab.tech.
# The website in site/ deploys separately through Cloudflare Pages.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migrations
        working-directory: app
        run: npx wrangler d1 migrations apply mfd --remote

      - name: Build and deploy
        run: npm run deploy

      - name: Verify the live deploy
        run: |
          base=https://app.modscrim.dualmindlab.tech
          for path in /api/health / /console; do
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base$path" || true)
              echo "$path -> $code (attempt $i)"
              if [ "$code" = 200 ]; then ok=1; break; fi
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "::error::$base$path did not return 200 after deploy"; exit 1; }
          done
