name: Demo end-to-end

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: App Worker URL to exercise
        required: true
        default: https://app.modscrim.dualmindlab.tech

permissions:
  contents: read

jobs:
  demo-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the shared demo setup and loop
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test --project=setup --project=demo