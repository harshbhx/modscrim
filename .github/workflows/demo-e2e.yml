name: Demo end-to-end

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: App Worker URL to exercise
        required: true
        default: https://app.modscrim.dualmindlab.tech

permissions:
  contents: read

jobs:
  demo-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run the demo loop
        env:
          DEMO_BASE_URL: ${{ inputs.base_url }}
        run: |
          cp scripts/demo-e2e.mjs "$RUNNER_TEMP/pw/demo-e2e.mjs"
          cd "$RUNNER_TEMP/pw"
          node demo-e2e.mjs "$DEMO_BASE_URL"
