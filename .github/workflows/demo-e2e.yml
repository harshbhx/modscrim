name: Demo end-to-end

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: App Worker URL to exercise
        required: true
        default: https://app.modscrim.dualmindlab.tech

permissions:
  contents: read

jobs:
  demo-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read Playwright version
        id: playwright-version
        run: node -e "console.log('version=' + require('playwright/package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium (download on cache miss, system deps always)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi
      - name: Run the shared demo setup and loop
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'schedule' && 'https://app.modscrim.dualmindlab.tech' || inputs.base_url || 'https://app.modscrim.dualmindlab.tech' }}
        run: npx playwright test --project=setup --project=demo
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-demo-playwright-${{ github.run_id }}
          path: |
            app/e2e/report
            test-results
          if-no-files-found: warn
          retention-days: 14