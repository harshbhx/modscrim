name: UI final screens

# One artifact, "ui-final-screens", with a folder per surface (app-landing,
# app-demo, console, mod, overlay, share-card, shell, site, docs), light and dark
# at 375, 768 and 1440 px, plus INDEX.md and AUDIT.md. A dedicated workflow
# because the screenshots come from two servers (the built SPA and site/) that
# the e2e and site workflows start separately, and a reviewer wants them in one
# download. It reruns the surface and site projects, so it also enforces the
# accessibility audit (app/e2e/lib/audit.ts) with A11Y_ENFORCE=1 unless the
# dispatch input turns that off.
on:
  workflow_dispatch:
    inputs:
      enforce:
        description: 'Fail on audit findings (1) or only record them (0)'
        default: '1'

permissions:
  contents: read

concurrency:
  group: ui-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    name: Consolidated screenshots and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read Playwright version
        id: playwright-version
        run: node -e "console.log('version=' + require('playwright/package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium (download on cache miss, system deps always)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi
      - name: Build the SPA
        run: npm run build -w app

      - name: Serve the SPA and the site, run the surface projects
        env:
          A11Y_ENFORCE: ${{ github.event.inputs.enforce || '1' }}
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SURFACE_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SITE_BASE_URL: http://127.0.0.1:4174
        run: |
          node scripts/serve-static.mjs app/dist/client 4173 &
          node scripts/serve-static.mjs site 4174 &
          for port in 4173 4174; do
            for i in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
            curl -sf "http://127.0.0.1:$port/" >/dev/null || { echo "static server $port never came up"; exit 1; }
          done
          # keep going after a failure so every screenshot and finding is collected
          set +e
          npx playwright test --project=landing --project=shell-surface --project=console-surface --project=report-surface --project=mod-surface --project=overlay-surface --project=shared-states --project=a11y --project=site --reporter=list --retries=0
          echo "playwright_exit=$?" >> "$GITHUB_ENV"

      - name: Sort screenshots into folders and write INDEX.md and AUDIT.md
        if: always()
        run: |
          node scripts/ui-final-index.mjs
          cat ui-final-screens/INDEX.md | head -30
          cp ui-final-screens/AUDIT.md "$GITHUB_STEP_SUMMARY"
          cp app/e2e/ui-final/audit.jsonl ui-final-screens/audit.jsonl 2>/dev/null || true

      - name: Upload ui-final-screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-final-screens
          path: ui-final-screens
          if-no-files-found: error
          retention-days: 30

      - name: Fail when a test failed
        if: always()
        run: '[ "${playwright_exit:-0}" = "0" ]'
